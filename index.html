<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR Minimalista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
    <style>
        /* Animaciones suaves */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estilo para el contenedor del QR generado por la librería */
        #qr-container canvas {
            margin: 0 auto;
            border-radius: 0.5rem;
        }

        /* Ocultar barra de desplazamiento */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Colores Corporativos Grupo IT */
        input:focus,
        textarea:focus,
        button:focus {
            border-color: #009FE3 !important;
            outline: none;
        }

        input[type="radio"]:checked,
        input[type="checkbox"]:checked {
            background-color: #009FE3 !important;
            border-color: #009FE3 !important;
        }
    </style>
</head>

<body class="bg-zinc-50 min-h-screen flex items-center justify-center p-4 font-sans text-zinc-900">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-sm p-8 border-2 border-zinc-300">

        <!-- Logo Corporativo Grupo IT -->
        <div class="flex justify-center mb-8">
            <img src="logo_texto.png" alt="Logo Grupo IT" class="h-16 object-contain">
        </div>

        <!-- Menú Desplegable Minimalista -->
        <div class="relative mb-8">
            <button id="dropdown-btn" type="button"
                class="w-full flex items-center justify-between bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3.5 text-zinc-800 hover:border-[#009FE3] focus:border-[#009FE3] transition-all outline-none group">
                <span id="dropdown-label" class="text-sm font-bold group-focus:text-[#009FE3] transition-colors">Enlace
                    / Texto</span>
                <svg id="dropdown-icon"
                    class="w-5 h-5 text-zinc-400 group-focus:text-[#009FE3] transition-transform duration-200"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>

            <div id="dropdown-menu"
                class="absolute z-10 w-full mt-2 bg-white border-2 border-zinc-200 rounded-xl shadow-lg hidden opacity-0 transition-all duration-200 transform origin-top -translate-y-2">
                <div class="p-1.5 space-y-1">
                    <button onclick="setTab('url', 'Enlace / Texto')"
                        class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-[#009FE3]/10 hover:text-[#009FE3] transition-colors">Enlace
                        / Texto</button>
                    <button onclick="setTab('wifi', 'Conexión Wi-Fi')"
                        class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-[#009FE3]/10 hover:text-[#009FE3] transition-colors">Conexión
                        Wi-Fi</button>
                    <button onclick="setTab('google', 'Reseña Google Business')"
                        class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-[#009FE3]/10 hover:text-[#009FE3] transition-colors">Reseña
                        Google Business</button>
                    <button onclick="setTab('whatsapp', 'Mensaje WhatsApp')"
                        class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-[#009FE3]/10 hover:text-[#009FE3] transition-colors">Mensaje
                        WhatsApp</button>
                    <button onclick="setTab('vcard', 'Tarjeta de Contacto (vCard)')"
                        class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-[#009FE3]/10 hover:text-[#009FE3] transition-colors">Tarjeta
                        de Contacto (vCard)</button>
                    <button onclick="setTab('email', 'Enviar Email')"
                        class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-[#009FE3]/10 hover:text-[#009FE3] transition-colors">Enviar
                        Email</button>
                </div>
            </div>
        </div>

        <!-- Formularios Dinámicos -->
        <div id="form-container" class="min-h-[120px]">

            <!-- Formulario URL/Texto -->
            <div id="form-url" class="fade-in space-y-4">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Contenido</label>
                    <textarea id="input-text" rows="3"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-4 text-zinc-800 placeholder-zinc-300 focus:border-zinc-900 focus:bg-white transition-all resize-none outline-none"
                        placeholder="https://tu-web.com o escribe algo..."></textarea>
                </div>
            </div>

            <!-- Formulario Wi-Fi (Oculto por defecto) -->
            <div id="form-wifi" class="fade-in space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Nombre de la Red
                        (SSID)</label>
                    <input type="text" id="wifi-ssid"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3.5 text-zinc-800 placeholder-zinc-300 focus:border-zinc-900 focus:bg-white transition-all outline-none"
                        placeholder="Mi_Red_WiFi">
                </div>
                <div>
                    <label
                        class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Contraseña</label>
                    <input type="password" id="wifi-pass"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3.5 text-zinc-800 placeholder-zinc-300 focus:border-zinc-900 focus:bg-white transition-all outline-none"
                        placeholder="••••••••">
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex space-x-4">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="wifi-type" value="WPA" checked
                                class="text-zinc-900 border-zinc-300 focus:ring-zinc-900">
                            <span class="text-sm font-medium text-zinc-700">WPA/WPA2</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="wifi-type" value="WEP"
                                class="text-zinc-900 border-zinc-300 focus:ring-zinc-900">
                            <span class="text-sm font-medium text-zinc-700">WEP</span>
                        </label>
                    </div>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="wifi-hidden"
                            class="rounded border-2 border-zinc-300 text-zinc-900 focus:ring-zinc-900">
                        <span class="text-sm font-medium text-zinc-700">Red Oculta</span>
                    </label>
                </div>
            </div>

            <!-- Formulario Reseña Google (Oculto por defecto) -->
            <div id="form-google" class="fade-in space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Enlace de
                        Reseña</label>
                    <input type="url" id="google-url"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3.5 text-zinc-800 placeholder-zinc-300 focus:border-zinc-900 focus:bg-white transition-all outline-none"
                        placeholder="https://g.page/r/...">
                    <p class="mt-2 text-xs text-zinc-500 font-medium">Pega el "enlace corto" para pedir reseñas que te
                        da el Perfil de Empresa de Google.</p>
                </div>
            </div>

            <!-- Formulario WhatsApp -->
            <div id="form-whatsapp" class="fade-in space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Teléfono (con
                        prefijo)</label>
                    <input type="tel" id="wa-tel"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3 text-sm text-zinc-800 focus:border-zinc-900 outline-none"
                        placeholder="+34 600 000 000">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Mensaje
                        inicial</label>
                    <textarea id="wa-text" rows="2"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3 text-sm text-zinc-800 focus:border-zinc-900 outline-none resize-none"
                        placeholder="Hola, quiero información..."></textarea>
                </div>
            </div>

            <!-- Formulario vCard -->
            <div id="form-vcard" class="fade-in space-y-4 hidden">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label
                            class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Nombre</label>
                        <input type="text" id="vc-nombre"
                            class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-2.5 text-sm text-zinc-800 focus:border-zinc-900 outline-none">
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Apellidos</label>
                        <input type="text" id="vc-apellidos"
                            class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-2.5 text-sm text-zinc-800 focus:border-zinc-900 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label
                            class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Teléfono</label>
                        <input type="tel" id="vc-tel"
                            class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-2.5 text-sm text-zinc-800 focus:border-zinc-900 outline-none">
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Email</label>
                        <input type="email" id="vc-email"
                            class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-2.5 text-sm text-zinc-800 focus:border-zinc-900 outline-none">
                    </div>
                </div>
                <div>
                    <label
                        class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Empresa</label>
                    <input type="text" id="vc-empresa"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-2.5 text-sm text-zinc-800 focus:border-zinc-900 outline-none">
                </div>
                <div>
                    <label
                        class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Página Web</label>
                    <input type="url" id="vc-web" placeholder="https://www.ejemplo.com"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-2.5 text-sm text-zinc-800 focus:border-zinc-900 outline-none">
                </div>
                <div>
                    <label
                        class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Dirección de Oficina</label>
                    <input type="text" id="vc-direccion" placeholder="Calle, Ciudad, CP, País"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-2.5 text-sm text-zinc-800 focus:border-zinc-900 outline-none">
                </div>
            </div>

            <!-- Formulario Email -->
            <div id="form-email" class="fade-in space-y-4 hidden">
                <div>
                    <label
                        class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Destinatario</label>
                    <input type="email" id="em-to"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3 text-sm text-zinc-800 focus:border-zinc-900 outline-none"
                        placeholder="hola@ejemplo.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Asunto</label>
                    <input type="text" id="em-sub"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3 text-sm text-zinc-800 focus:border-zinc-900 outline-none"
                        placeholder="Motivo del contacto">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Mensaje</label>
                    <textarea id="em-body" rows="2"
                        class="w-full bg-zinc-50 border-2 border-zinc-200 rounded-xl p-3 text-sm text-zinc-800 focus:border-zinc-900 outline-none resize-none"></textarea>
                </div>
            </div>

        </div>

        <!-- Área de visualización del QR -->
        <div class="mt-8 flex flex-col items-center justify-center">
            <div id="qr-wrapper"
                class="bg-white p-4 rounded-xl shadow-sm border-2 border-zinc-200 transition-all duration-300 transform scale-95 opacity-50 relative">
                <div id="qr-container"
                    class="w-48 h-48 flex items-center justify-center bg-zinc-50 rounded-lg border border-zinc-100 text-[#009FE3] text-sm font-medium text-center px-4">
                    Esperando datos...
                </div>
            </div>

            <!-- Botón de descarga (Aparece cuando hay QR) -->
            <button id="btn-download" onclick="downloadQR()"
                class="mt-6 flex items-center space-x-2 text-sm font-bold text-zinc-500 hover:text-[#009FE3] transition-colors opacity-0 pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                    viewBox="0 0 256 256">
                    <path
                        d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM122.34,165.66a8,8,0,0,0,11.32,0l48-48a8,8,0,0,0-11.32-11.32L136,140.69V32a8,8,0,0,0-16,0V140.69L85.66,106.34A8,8,0,0,0,74.34,117.66Z">
                    </path>
                </svg>
                <span>Descargar Código QR</span>
            </button>
        </div>

    </main>

    <script>
        let qrcode = null;
        let currentTab = 'url';
        const tabsList = ['url', 'wifi', 'google', 'whatsapp', 'vcard', 'email'];

        // Elementos DOM - Dropdown
        const dropdownBtn = document.getElementById('dropdown-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const dropdownLabel = document.getElementById('dropdown-label');
        const dropdownIcon = document.getElementById('dropdown-icon');
        const qrContainer = document.getElementById('qr-container');
        const qrWrapper = document.getElementById('qr-wrapper');
        const btnDownload = document.getElementById('btn-download');

        // Lógica del Dropdown Minimalista
        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = dropdownMenu.classList.contains('hidden');
            if (isHidden) {
                dropdownMenu.classList.remove('hidden');
                setTimeout(() => {
                    dropdownMenu.classList.remove('opacity-0', '-translate-y-2');
                    dropdownIcon.classList.add('rotate-180');
                }, 10);
            } else {
                closeDropdown();
            }
        });

        function closeDropdown() {
            dropdownMenu.classList.add('opacity-0', '-translate-y-2');
            dropdownIcon.classList.remove('rotate-180');
            setTimeout(() => {
                dropdownMenu.classList.add('hidden');
            }, 200);
        }

        document.addEventListener('click', (e) => {
            if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                closeDropdown();
            }
        });

        // Función para cambiar de pestaña/formulario
        function setTab(selected, labelText) {
            currentTab = selected;
            dropdownLabel.textContent = labelText;
            closeDropdown();

            tabsList.forEach(tab => {
                const form = document.getElementById(`form-${tab}`);
                if (tab === selected) {
                    form.classList.remove('hidden');
                } else {
                    form.classList.add('hidden');
                }
            });

            generate();
        }

        // Función para escapar caracteres especiales en el QR de Wi-Fi (Mejora iOS/Android)
        function escapeWifi(str) {
            return str.replace(/([\\;:,\"])/g, '\\$1');
        }

        // Función principal que genera el QR
        function generate() {
            let data = "";

            if (currentTab === 'url') {
                data = document.getElementById('input-text').value.trim();
            } else if (currentTab === 'wifi') {
                const ssid = document.getElementById('wifi-ssid').value.trim();
                const pass = document.getElementById('wifi-pass').value.trim();
                const isHidden = document.getElementById('wifi-hidden').checked;

                let type = "WPA";
                for (const radio of document.getElementsByName('wifi-type')) {
                    if (radio.checked) type = radio.value;
                }
                if (!pass) type = "nopass"; // Si no hay contraseña, forzar formato sin seguridad

                // Formato robusto y compatible iOS/Android
                if (ssid) {
                    data = `WIFI:T:${type};S:${escapeWifi(ssid)};P:${escapeWifi(pass)};H:${isHidden ? 'true' : 'false'};;`;
                }
            } else if (currentTab === 'google') {
                data = document.getElementById('google-url').value.trim();
            } else if (currentTab === 'whatsapp') {
                let tel = document.getElementById('wa-tel').value.replace(/[^0-9\+]/g, '');
                const msg = encodeURIComponent(document.getElementById('wa-text').value.trim());
                if (tel) data = `https://wa.me/${tel}${msg ? '?text=' + msg : ''}`;
            } else if (currentTab === 'vcard') {
                const nom = document.getElementById('vc-nombre').value.trim();
                const ape = document.getElementById('vc-apellidos').value.trim();
                const tel = document.getElementById('vc-tel').value.trim();
                const email = document.getElementById('vc-email').value.trim();
                const emp = document.getElementById('vc-empresa').value.trim();
                const dir = document.getElementById('vc-direccion').value.trim();
                const web = document.getElementById('vc-web').value.trim();

                    data = `BEGIN:VCARD\nVERSION:3.0\nN:${ape};${nom};;;\nFN:${nom} ${ape}\nORG:${emp}\nTEL:${tel}\nEMAIL:${email}`;

            if (qrcode) {

                    extension: "png"
                });
            }
        }

        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('input', generate);

        });

        setTimeout(generate, 200);
